[workspace]
name = "pristine"
version = "0.2.0"
description = "PRISTINE: PRimer-based Identification Suite Targeting Informative Nucleotide Elements"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "osx-arm64", "osx-64"]

[dependencies]
python = "3.11.*"
minimap2 = ">=2.24"
mafft = "*"
biopython = "*"
pandas = "*"
numpy = "*"
pyyaml = "*"
matplotlib-base = "*"
primer3-py = "*"
pytest = "*"

[pypi-dependencies]
pristine = { path = ".", editable = true }

[tasks]
pristine = "pristine"
test = "pytest -q tests"
